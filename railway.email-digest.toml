[build]
dockerfilePath = "Dockerfile.scrape"

[deploy]
startCommand = "npm run send-digest"
# Weekly "this week in SF" email digest (issue #97): emails every opted-in
# account the week's featured picks plus events matching the categories /
# neighbourhoods they've hearted. The strongest return-visit mechanic we have;
# Resend is already wired up for magic links.
#
# Cron schedule: 0 16 * * 1 (4pm UTC Monday = 9am PT) — fires once a week,
# Monday morning SF time, so the window is the full Mon–Sun week ahead and the
# email lands while people are planning. Set this in the Railway dashboard under
# the service's Settings → Cron Schedule.
#
# Requires env: DATABASE_URL, RESEND_API_KEY, RESEND_FROM_EMAIL (verified
# sender), NEXT_PUBLIC_BASE_URL (for event + unsubscribe links).
